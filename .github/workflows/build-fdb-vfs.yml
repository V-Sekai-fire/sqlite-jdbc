name: build-fdb-vfs
on:
  push:
    branches: [feat/fdb-vfs]
  pull_request:
  workflow_dispatch:

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FoundationDB client (7.3.63)
        run: |
          curl -LO https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-clients_7.3.63-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.3.63-1_amd64.deb

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip curl

      - name: Build the amalgamated native library (with FDB VFS baked in)
        env:
          CCFLAGS: -I/usr/include/foundationdb -DFDB_API_VERSION=730
          LINKFLAGS: -L/usr/lib -Wl,-rpath,/usr/lib
        run: |
          make native

      - name: Confirm libsqlitejdbc.so exports the FDB VFS symbols
        run: |
          set -eux
          so=$(find src/main/resources/org/sqlite/native/Linux/x86_64 -name '*.so' | head -1)
          test -n "$so"
          nm -gU "$so" 2>/dev/null || true
          # Sanity: the object was linked (extension-registration path present)
          objdump -T "$so" | grep -E "weft_fdb_start|weft_vfs_register" || \
            (echo "weft_* symbols missing" && exit 1)

      - name: Package the jar
        run: |
          mvn -B -Dmaven.test.skip=true package

      - name: Upload sqlite-jdbc-fdb-vfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-jdbc-fdb-vfs-linux-x86_64
          path: target/*.jar
